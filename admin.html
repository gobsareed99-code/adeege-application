<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADEEGE Admin Portal</title>
<link rel="icon" type="image/png" href="assets/adeege-favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7f5;color:#173026}.shell{min-height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:#073824;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 22px}.brand img{width:48px;height:48px;border-radius:12px}.brand strong{display:block;font-size:17px}.brand small{color:#9ec7af;font-size:10px}.nav{display:grid;gap:7px}.nav button,.back{width:100%;border:0;border-radius:10px;padding:12px 13px;text-align:left;background:transparent;color:#dcebe2;font-weight:800;cursor:pointer}.nav button:hover,.nav button.active{background:#0b7f40;color:#fff}.back{margin-top:18px;background:#fff;color:#0b6637;text-decoration:none;display:block}.main{padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.status{padding:8px 12px;border-radius:999px;background:#e7f6ec;color:#08743a;font-size:11px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e2e9e4;border-radius:14px;padding:17px;box-shadow:0 5px 18px rgba(0,60,30,.05)}.card small{color:#71847a;font-weight:700}.card strong{display:block;font-size:28px;margin-top:8px;color:#0b713b}.panel{background:#fff;border:1px solid #e2e9e4;border-radius:14px;padding:17px;box-shadow:0 5px 18px rgba(0,60,30,.05)}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel h2{margin:0;font-size:18px}.refresh{border:0;background:#0b7f40;color:#fff;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.table-wrap{overflow:auto}.data{width:100%;border-collapse:collapse;font-size:11px}.data th{background:#f4f7f5;text-align:left;padding:10px;white-space:nowrap;color:#586d61}.data td{padding:10px;border-top:1px solid #edf1ee;vertical-align:top;max-width:260px;word-break:break-word}.empty,.gate{padding:32px;text-align:center;color:#6b7d73}.gate{max-width:560px;margin:70px auto;background:#fff;border-radius:16px;border:1px solid #e1e9e4}.gate h2{color:#0b713b}.gate a{display:inline-block;margin-top:12px;background:#0b7f40;color:#fff;text-decoration:none;padding:11px 15px;border-radius:9px;font-weight:800}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.main{padding:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.nav{grid-template-columns:1fr 1fr}.data{font-size:10px}}
</style>
</head>
<body>
<div id="gate" class="gate"><h2>🛡️ ADEEGE Admin Portal</h2><p>Checking your Admin access…</p></div>
<div id="app" class="shell" hidden>
<aside class="side"><div class="brand"><img src="assets/adeege-logo.jpg" alt="ADEEGE"><div><strong>ADEEGE ADMIN</strong><small>Protected management portal</small></div></div><div class="nav" id="nav"></div><a class="back" href="stable.html?v=31">← Back to Marketplace</a></aside>
<main class="main"><div class="top"><div><h1 id="title">Overview</h1><p style="margin:5px 0 0;color:#71847a;font-size:12px">Manage ADEEGE without affecting the public marketplace.</p></div><div class="status">ADMIN VERIFIED</div></div><div class="cards" id="cards"></div><section class="panel"><div class="panel-head"><h2 id="panelTitle">Overview</h2><button class="refresh" id="refresh">Refresh</button></div><div id="content" class="empty">Loading…</div></section></main>
</div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const sb=createClient('https://tjwoqvqfavxqykvbasaf.supabase.co','sb_publishable_3XeoEp9EqRqPLPIm5Cwthg_Pf1lEYUZ');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const defs={overview:null,users:'marketplace_profiles',sellers:'marketplace_stores',products:'marketplace_products',orders:'marketplace_orders',payments:'marketplace_payments',reports:'marketplace_reports',disputes:'marketplace_disputes',deliveries:'marketplace_deliveries'};
const labels={overview:'Overview',users:'Users',sellers:'Sellers',products:'Products',orders:'Orders',payments:'Payments',reports:'Reports',disputes:'Disputes',deliveries:'Deliveries'};
let active='overview';
async function count(table){const{count,error}=await sb.from(table).select('*',{count:'exact',head:true});return error?0:(count||0)}
async function verify(){const{data:{session}}=await sb.auth.getSession();if(!session)return deny('Please log in with your Admin account first.');const{data,error}=await sb.rpc('adeege_is_admin');if(error||data!==true)return deny('This account does not have Admin access.');document.getElementById('gate').hidden=true;document.getElementById('app').hidden=false;buildNav();await load('overview')}
function deny(msg){document.getElementById('gate').innerHTML=`<h2>🛡️ ADEEGE Admin Portal</h2><p>${esc(msg)}</p><a href="stable.html?v=31">Return to Marketplace / Login</a>`}
function buildNav(){const nav=document.getElementById('nav');nav.innerHTML=Object.keys(defs).map(k=>`<button data-tab="${k}">${labels[k]}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.dataset.tab))}
async function load(tab){active=tab;document.getElementById('title').textContent=labels[tab];document.getElementById('panelTitle').textContent=labels[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='overview')return overview();const table=defs[tab];const box=document.getElementById('content');box.className='empty';box.textContent='Loading…';const{data,error}=await sb.from(table).select('*').order('created_at',{ascending:false}).limit(100);if(error){box.textContent=error.message;return}renderTable(data||[])}
async function overview(){const [u,s,p,o,pay,d]=await Promise.all([count('marketplace_profiles'),count('marketplace_stores'),count('marketplace_products'),count('marketplace_orders'),count('marketplace_payments'),count('marketplace_deliveries')]);document.getElementById('cards').innerHTML=`<div class="card"><small>Users</small><strong>${u}</strong></div><div class="card"><small>Sellers</small><strong>${s}</strong></div><div class="card"><small>Products</small><strong>${p}</strong></div><div class="card"><small>Orders</small><strong>${o}</strong></div><div class="card"><small>Payments</small><strong>${pay}</strong></div><div class="card"><small>Deliveries</small><strong>${d}</strong></div>`;document.getElementById('content').className='';document.getElementById('content').innerHTML='<div class="empty">Choose a management section from the Admin menu.</div>'}
function renderTable(rows){const box=document.getElementById('content');if(!rows.length){box.className='empty';box.textContent='No records found.';return}const priority=['id','name','full_name','email','order_number','status','role','price','quantity','total_amount','amount','created_at'];const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];keys.sort((a,b)=>(priority.indexOf(a)<0?999:priority.indexOf(a))-(priority.indexOf(b)<0?999:priority.indexOf(b)));const shown=keys.slice(0,9);box.className='table-wrap';box.innerHTML=`<table class="data"><thead><tr>${shown.map(k=>`<th>${esc(k.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${shown.map(k=>`<td>${esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
document.getElementById('refresh').onclick=()=>load(active);verify();
</script>
</body></html>
