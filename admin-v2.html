<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADEEGE Admin Portal</title>
<link rel="icon" type="image/png" href="assets/adeege-favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7f5;color:#173026}button,input{font:inherit}.login-page{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(460px,100%);background:#fff;border:1px solid #dfe8e2;border-radius:22px;padding:28px;box-shadow:0 20px 55px rgba(0,70,38,.10)}.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:20px}.login-brand img{width:58px;height:58px;border-radius:14px}.login-brand strong{display:block;color:#0b713b;font-size:20px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:800;font-size:12px}.field input{height:46px;border:1px solid #dce5df;border-radius:10px;padding:0 12px}.primary{width:100%;border:0;border-radius:10px;padding:13px 15px;background:#0b7f40;color:#fff;font-weight:900;cursor:pointer}.msg{display:none;margin-top:12px;padding:10px;border-radius:9px;font-size:12px}.msg.show{display:block}.msg.err{background:#fff0f0;color:#a22424}.shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.side{background:#073824;color:#fff;padding:22px 16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 22px}.brand img{width:48px;height:48px;border-radius:12px}.brand strong{display:block}.brand small{color:#9ec7af}.nav{display:grid;gap:7px}.nav button,.back,.logout{width:100%;border:0;border-radius:10px;padding:12px 13px;text-align:left;background:transparent;color:#dcebe2;font-weight:800;cursor:pointer;text-decoration:none;display:block}.nav button.active,.nav button:hover{background:#0b7f40;color:#fff}.back{margin-top:18px;background:#fff;color:#0b6637}.logout{margin-top:8px;background:#ffffff14}.main{padding:24px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:27px}.status{padding:8px 12px;border-radius:999px;background:#e7f6ec;color:#08743a;font-size:11px;font-weight:900}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card{background:#fff;border:1px solid #e2e9e4;border-radius:14px;padding:17px}.card small{color:#71847a;font-weight:700}.card strong{display:block;font-size:28px;margin-top:8px;color:#0b713b}.panel{background:#fff;border:1px solid #e2e9e4;border-radius:14px;padding:17px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.panel h2{margin:0;font-size:18px}.refresh{border:0;background:#0b7f40;color:#fff;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.table-wrap{overflow:auto}.data{width:100%;border-collapse:collapse;font-size:11px}.data th{background:#f4f7f5;text-align:left;padding:10px;white-space:nowrap;color:#586d61}.data td{padding:10px;border-top:1px solid #edf1ee;vertical-align:top;max-width:280px;word-break:break-word}.empty{padding:32px;text-align:center;color:#6b7d73}.error{padding:16px;border-radius:10px;background:#fff0f0;color:#a22424}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:560px){.cards{grid-template-columns:1fr}.nav{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<section id="loginPage" class="login-page"><div class="login-card"><div class="login-brand"><img src="assets/adeege-logo.jpg" alt="ADEEGE"><div><strong>ADEEGE ADMIN</strong><small>Protected management portal</small></div></div><h1>🛡️ Admin Login</h1><p>Use your ADEEGE administrator account.</p><form id="adminLoginForm"><div class="field"><label>Email</label><input id="adminEmail" type="email" required></div><div class="field"><label>Password</label><input id="adminPassword" type="password" minlength="6" required></div><button class="primary" id="adminLoginBtn">Login to Admin Portal</button><div id="loginMsg" class="msg"></div></form><p><a href="stable.html?v=33">← Back to Marketplace</a></p></div></section>
<div id="adminApp" class="shell" hidden><aside class="side"><div class="brand"><img src="assets/adeege-logo.jpg" alt="ADEEGE"><div><strong>ADEEGE ADMIN</strong><small>Protected management portal</small></div></div><div class="nav" id="adminNav"><button data-tab="overview">📊 Overview</button><button data-tab="users">👥 Users</button><button data-tab="sellers">🏪 Sellers</button><button data-tab="products">📦 Products</button><button data-tab="orders">🧾 Orders</button><button data-tab="payments">💳 Payments</button><button data-tab="reports">📈 Reports</button><button data-tab="disputes">⚖️ Disputes</button><button data-tab="deliveries">🚚 Deliveries</button></div><a class="back" href="stable.html?v=33">← Back to Marketplace</a><button class="logout" id="adminLogout">↪ Logout Admin</button></aside><main class="main"><div class="top"><div><h1 id="title">Overview</h1><p style="margin:5px 0 0;color:#71847a;font-size:12px">Secure ADEEGE management data.</p></div><div class="status">ADMIN VERIFIED</div></div><div class="cards" id="cards"></div><section class="panel"><div class="panel-head"><h2 id="panelTitle">Overview</h2><button class="refresh" id="refresh">Refresh</button></div><div id="content" class="empty">Loading…</div></section></main></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.4';
const sb=createClient('https://tjwoqvqfavxqykvbasaf.supabase.co','sb_publishable_3XeoEp9EqRqPLPIm5Cwthg_Pf1lEYUZ');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const labels={overview:'Overview',users:'Users',sellers:'Sellers',products:'Products',orders:'Orders',payments:'Payments',reports:'Reports',disputes:'Disputes',deliveries:'Deliveries'};let active='overview';
function msg(t,e=false){const m=document.getElementById('loginMsg');m.textContent=t;m.className='msg show'+(e?' err':'')}
async function verify(){const{data:{session}}=await sb.auth.getSession();if(!session)return false;const{data,error}=await sb.rpc('adeege_is_admin');return !error&&data===true}
async function enter(){document.getElementById('loginPage').hidden=true;document.getElementById('adminApp').hidden=false;await load('overview')}
async function callSection(section){const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('Request timed out. Please refresh.')),12000));const request=sb.rpc('adeege_admin_section',{p_section:section}).then(({data,error})=>{if(error)throw error;return data});return Promise.race([request,timeout])}
async function load(tab){active=tab;document.getElementById('title').textContent=labels[tab];document.getElementById('panelTitle').textContent=labels[tab];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));const box=document.getElementById('content');box.className='empty';box.textContent='Loading…';document.getElementById('cards').innerHTML='';try{const data=await callSection(tab);if(tab==='overview'){renderOverview(data||{});return}renderTable(Array.isArray(data)?data:[])}catch(e){box.className='error';box.textContent=e.message||String(e)}}
function renderOverview(d){document.getElementById('cards').innerHTML=['users','sellers','products','orders','payments','reports','disputes','deliveries'].map(k=>`<div class="card"><small>${labels[k]}</small><strong>${Number(d[k]||0)}</strong></div>`).join('');document.getElementById('content').className='empty';document.getElementById('content').textContent='Select a management section from the Admin menu.'}
function renderTable(rows){const box=document.getElementById('content');if(!rows.length){box.className='empty';box.textContent='No records found.';return}const priority=['id','name','full_name','email','order_number','status','role','price','quantity','total_amount','amount','created_at'];const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];keys.sort((a,b)=>(priority.indexOf(a)<0?999:priority.indexOf(a))-(priority.indexOf(b)<0?999:priority.indexOf(b)));const shown=keys.slice(0,9);box.className='table-wrap';box.innerHTML=`<table class="data"><thead><tr>${shown.map(k=>`<th>${esc(k.replaceAll('_',' '))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${shown.map(k=>`<td>${esc(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>load(b.dataset.tab));document.getElementById('refresh').onclick=()=>load(active);document.getElementById('adminLogout').onclick=async()=>{await sb.auth.signOut();location.reload()};document.getElementById('adminLoginForm').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('adminLoginBtn');btn.disabled=true;try{const{error}=await sb.auth.signInWithPassword({email:document.getElementById('adminEmail').value.trim(),password:document.getElementById('adminPassword').value});if(error)return msg(error.message,true);if(!(await verify())){await sb.auth.signOut();return msg('This account does not have ADEEGE Admin permission.',true)}await enter()}finally{btn.disabled=false}};(async()=>{if(await verify())await enter()})();
</script>
</body></html>
