<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ADEEGE — Shop Products</title>
<link rel="icon" type="image/png" href="assets/adeege-favicon.png">
<link rel="stylesheet" href="assets/shops-admin.css">
<style>.product-admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.product-list{display:grid;gap:10px}.product-row{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border:1px solid #e3e8ee;border-radius:12px;padding:10px;background:#fff}.product-row img{width:70px;height:70px;object-fit:cover;border-radius:9px;background:#eef4f5}.product-row h3{margin:0 0 5px;font-size:14px}.product-row p{margin:2px 0;font-size:11px;color:#667384}.preview{display:none;width:120px;height:120px;object-fit:cover;border-radius:10px;margin-top:8px}.preview.show{display:block}@media(max-width:820px){.product-admin-grid{grid-template-columns:1fr}.product-row{grid-template-columns:60px 1fr}.product-row .actions{grid-column:1/-1}.product-row img{width:60px;height:60px}}</style>
</head>
<body>
<div class="shell">
<header class="top"><div class="wrap top-row"><div class="brand"><img src="assets/adeege-logo.jpg" alt="ADEEGE"><div><strong>ADEEGE APPLICATION</strong><small>Shop Product Management</small></div></div><a class="back" href="shops-admin.html?v=6">← Market Shops</a></div></header>
<section class="hero"><div class="wrap"><h1 id="shopTitle">🏪 Shop Products</h1><p id="shopMeta">Loading shop…</p></div></section>
<main class="wrap product-admin-grid">
<section class="panel"><div class="panel-head"><div><h2>Add Product to This Shop</h2><p>This product will belong only to the selected shop.</p></div></div><div class="panel-body"><div class="security" id="accessNotice">🔐 Checking administrator access…</div><form id="productForm" style="display:none"><div class="field"><label>Product name *</label><input id="productName" maxlength="140" required></div><div class="grid2"><div class="field"><label>Category</label><select id="productCategory"><option value="phones">Phones</option><option value="computers">Computers</option><option value="shoes">Shoes</option><option value="fashion">Fashion</option><option value="furniture">Furniture</option><option value="appliances">Appliances</option><option value="beauty">Beauty</option><option value="groceries">Groceries</option><option value="other">Other</option></select></div><div class="field"><label>Quantity *</label><input id="productQty" type="number" min="0" value="1" required></div></div><div class="field"><label>Price ($) *</label><input id="productPrice" type="number" min="0" step="0.01" required></div><div class="field"><label>Description</label><textarea id="productDescription" maxlength="1200"></textarea></div><div class="field"><label>Product photo *</label><input id="productPhoto" type="file" accept="image/*" capture="environment" required><img id="productPreview" class="preview" alt="Product preview"></div><div class="actions"><button class="primary" id="saveProductBtn" type="submit">Publish Product</button></div><div class="msg" id="formMsg"></div></form></div></section>
<section class="panel"><div class="panel-head"><div><h2>Products in This Shop</h2><p id="productCount">Loading…</p></div></div><div class="panel-body"><div class="product-list" id="productList"><div class="empty">Connecting to ADEEGE…</div></div></div></section>
</main>
</div>
<script defer src="assets/store-products-admin.js?v=1"></script>
</body>
</html>
